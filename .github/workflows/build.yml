name: Build Standalone IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Create Minimal Swift App
        run: |
          cat << 'EOF' > main.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .systemBackground

                  let label = UILabel()
                  label.text = "Собрано через GitHub Actions!"
                  label.textAlignment = .center
                  label.font = UIFont.systemFont(ofSize: 20, weight: .bold)
                  label.frame = vc.view.bounds
                  label.autoresizingMask = [.flexibleWidth, .flexibleHeight]

                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      - name: Compile Swift to iOS Binary (arm64)
        run: |
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -O main.swift \
            -o TestApp

      - name: Assemble App Bundle and Info.plist
        run: |
          mkdir -p Payload/TestApp.app
          mv TestApp Payload/TestApp.app/

          cat << 'EOF' > Payload/TestApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.hardst1ly.testapp</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Package into IPA
        run: |
          zip -r -q "TestApp.ipa" Payload
          rm -rf Payload main.swift

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-ipa
          path: TestApp.ipa
          retention-days: 7
